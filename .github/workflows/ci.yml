name: CI

# Runs on every pull request: checks, the emulator test suites, and a Hosting preview.

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

  emulators:
    name: Rules, functions and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --global firebase-tools@15
      # Rules, then the function logic, then the built functions bundle in the full emulator suite.
      - run: npm run test:emulator
      - run: npm run test:e2e

  preview:
    name: Hosting preview
    needs: [check]
    # Pull requests from forks can't get a token to deploy with, and shouldn't.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace web
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      # Signs in with a short-lived token; no key is stored anywhere. This account can only manage
      # Hosting preview channels, so a pull request can't use it to change anything else.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_PREVIEW_SERVICE_ACCOUNT }}
      - run: npm install --global firebase-tools@15
      - name: Deploy the preview
        id: deploy
        run: |
          firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
            --expires 7d \
            --json > preview.json
          url=$(node -e "const r = require('./preview.json'); const s = Object.values(r.result)[0]; console.log(s.url)")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Say where the preview is
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- hosting-preview -->';
            const body = `${marker}\nPreview of this pull request: ${{ steps.deploy.outputs.url }}\n\nIt uses the real Firebase project. Expires in 7 days.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
